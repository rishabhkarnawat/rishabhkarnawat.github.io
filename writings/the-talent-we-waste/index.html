  <script id="writing-post-data" type="application/json">{"slug":"the-talent-we-waste","title":"The Talent We Waste","subtitle":"On Malcolm Gladwell, the idea of capitalization, and why the world holds far more ability than it ever uses","date":"Jul 20, 2026","dateISO":"2026-07-20","substackUrl":"https://substack.com/home/post/p-207814970","intro":["Ask a room of ten-year-olds what they want to be, and the hands fly up before you finish the question. A scientist. An Olympic sprinter. A surgeon, an astronaut, a striker who scores in the final minute. Every one of them believes the door is wide open, and at that age, so did you. Here is what no one tells them, and what I never grasped myself until I heard Malcolm Gladwell speak at Microsoft Research about his book Outliers: most of the children who fall short will not fail for want of talent. They will fail because the world never came looking for it. Gladwell opens with a figure that lands like a blow. In East Memphis, one of the poorest neighborhoods in America, only one in six children who earn a college athletic scholarship ever reaches college. Football is the one thing America hunts for hardest, the field it floods with money, scouts, and Friday-night faith. If we lose five of every six gifts where we are searching hardest, imagine what slips away everywhere we barely look at all. That question has never once left me.","The whole talk turns on a single idea, one Gladwell borrows from the psychologist James Flynn. He calls it capitalization: out of everyone capable of doing something, the share who actually end up doing it. Picture a world at one hundred percent. Everyone suited to a thing is doing that thing. Every child with a scientist's mind grows up to work in a laboratory, and every child built to run ends up on a track. No society has ever come close, and that gap is the whole story. What I love about the word is the way it flips the question around. When one group outperforms another, my first instinct, and probably yours, is to ask what makes those people different. Capitalization asks the opposite: what is different about the world around them, and how much of the ability in front of it does each society actually manage to find, develop, and use? Almost everything in Outliers is an attempt to name the forces that hold this number down. There are three, it turns out, and not one of them is talent."],"sections":[{"title":"Poverty","paragraphs":["The first is poverty, and the evidence for its power comes from a study I have not been able to shake since. In the 1920s, Lewis Terman of Stanford gave an IQ test to 250,000 schoolchildren and pulled out the very top, children with IQs above 140, genius by any measure. He was certain he had found the country's future leaders, and he followed them for fifty years to watch it happen. It did not happen. The group split apart. A small share rose to real prominence. Most settled into ordinary, forgettable lives. And a large number simply failed, plainly and permanently, at nearly everything they tried. Terman hunted for the reason in their personalities, their habits, their health, and found nothing that explained it. What separated the ones who soared from the ones who sank came down to a single, almost embarrassing factor: money. The children who succeeded had grown up in comfortable homes, with books on the shelves and parents who had been to college. The children who failed had grown up poor, with none of that around them. A one-in-a-billion mind, it turned out, was no match for the absence of money.","The finding deserves to be stated in its strongest form. An extraordinary mind was not sufficient to secure even an ordinary life. Poverty did not merely slow these children; it erased them. Those of us who have never lived inside it, and I include myself, systematically underestimate what it removes: the books, the stability, the encouragement, the whole invisible scaffolding that allows ability to become achievement."]},{"title":"The stupidity constraint","paragraphs":["The second force is stranger, because we impose it on ourselves, and it is the one that made me sit up. Examine the birthdays of any elite youth hockey or soccer team and a pattern appears that has no business existing: the players are born overwhelmingly in January, February, and March. On the 2007 Czech junior hockey team, eleven of twenty players arrived in those three months. The explanation is an ordinary administrative line. Youth sport groups children by calendar year, so at the age of ten, when the scouts first come looking, a boy born in January is competing against boys nearly a year younger. He is taller, faster, more coordinated, and he looks, to every adult watching, like the gifted one. He is then given the better coaches, the extra games, the longer seasons, until the illusion becomes true and the oldest genuinely are the best. The selection system did not discover talent. It created it, and then congratulated itself on its eye.","Gladwell calls this the stupidity constraint, and the bluntness is the point. Nothing about it is natural or necessary. The same mechanism runs through education, where the youngest children in a school year are eleven percent less likely to attend university than the oldest, a lifelong tax levied on a birthday. The remedy is almost trivial: let children develop in parallel streams according to maturity, and select later. That we refuse to do this, in games we claim to care about and schools we claim to believe in, reveals something uncomfortable about meritocracy itself. Much of what we call merit is the residue of rules nobody remembers writing. And no individual, however determined, can out-train a cutoff date. Some walls can only be taken down by the people who built them."]},{"title":"Patience","paragraphs":["The third force is the hardest to see, because it lives inside the mind. For decades, students in Japan, South Korea, Singapore, and Hong Kong have beaten the West in mathematics, and by a wide margin. People reach for the usual explanations, better genes, better teachers, harder work, but the data points somewhere else. Along with the big international math test, TIMSS, students fill out a survey of 120 questions. It is so long that most of them give up before the end. A researcher named Erling Boe tried something clever: he ranked countries not by their math scores but by how many survey questions their students bothered to finish. The two rankings came out almost identical. It means you can predict how good a country is at math without asking a single math question. You only must see whether its children will stick with a boring task and finish it. Patience is not something that helps with the skill. Over time, it is the skill.","Gladwell's explanation for where this patience comes from reaches back centuries, into agriculture. The high-performing countries are heirs to rice cultivation, the most labor-intensive farming humanity has ever practiced, demanding some three thousand hours of work a year against the thousand or so of a medieval European peasant, who slept away his winters. A culture that lived by the proverb that the man who works from dawn to dusk three hundred and sixty days a year will not go hungry formed an understanding of effort that outlasted the paddies themselves. That understanding now sits, generations later, behind a child working through an algebra problem and assuming, before anything else, that the problem will yield."]},{"title":"Hardship as teacher","paragraphs":["But the story does not only run one way, and this is the part that gives me hope. About one in three American entrepreneurs, the people who build our companies, have a learning disability. Richard Branson is dyslexic. So is Charles Schwab. Many more are too. We like to say they succeeded despite it. The truth is they often succeeded because of it. Think about what a child who cannot read has to do just to get through school. They must ask others for help, so they learn to win people over. They must explain themselves out loud, so they learn to speak. They meet every day as a problem to solve, and in time they learn to lead. They are the exact skills a great founder needs, and they have been practicing them since they were six. The same idea may explain a school puzzle: why smaller classes barely help. A crowded room can teach a child to rely on themselves, and that is often worth more than the extra attention. So our strengths and weaknesses are not fixed at birth. Comfort can make us soft. Hardship, faced honestly, can be the best teacher we ever have."]},{"title":"Looking in the wrong ponds","paragraphs":["Once you see the idea, old arguments fall apart. People often point to Kenya's dominance in distance running as proof that some groups are simply born to run. But look closer. In Kenya, about a million schoolboys run ten to twelve miles a day. In the United States, the number is maybe five thousand. One country tests almost all of its running talent. The other tests almost none. Jamaica, a country of fewer than three million people, rules the sprints for the same reason: not a special gene pool, but an obsession with the sport that lets no fast child slip through. Gladwell sets a simple test, and I think he is right. If we did everything we could to develop people's ability and gaps still remained, then we could talk about talent. Until we do that, the argument means nothing."]},{"title":"What follows","paragraphs":["What makes capitalization more than an interesting idea, for me, is what follows from it. If talent is spread evenly but opportunity is not, then the people we overlook, the late born, the poor, the unfashionable, add up to a huge pool of wasted ability. Any group that learns to find them will beat the ones still fishing in the same old ponds. Gladwell offers one idea: let investors pay for a poor classroom's education in return for a small share of those students' future taxes, so that someone finally has a stake in children nobody bets on today. Every system that picks people, in hiring, in college admissions, in promotions, has its own hidden cutoff, some line that screens people out for reasons that have nothing to do with ability. The groups honest enough to look for theirs will find the talent everyone else keeps missing. The idea also turns inward, and that is where it hit me hardest. Saying I am just not a math person is a verdict. Saying I have not yet done the work under the right conditions is a beginning."]}],"outro":["And yet I come away hopeful, because these numbers can move, and move fast. A generation ago, only a few percent of American girls played organized sport. Then Title IX changed the rules, and within thirty years, playing became the norm rather than the exception. Think about what that means. The girls did not change. Their bodies, their hearts, their will to compete had been there all along, waiting. What changed was the world around them, and the moment it opened, the talent came pouring through, as if it had been pressing against the door for years. That is the whole argument in a single, hopeful fact. The waste of human ability is not a law of nature. It is a pile of choices, made by people, and what people have chosen, people can choose again. A fair chance is not something a society is handed, and not something it sits and waits for. It is something we build, with our own hands, for children whose names we will never know. And the most hopeful part of all is this: we already know how."]}</script>
